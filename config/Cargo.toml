[package]
name = "calory-cat-protocal-config"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
# examples in docs don't run without config files being in place, etc.
doctest = false

[package.metadata.gerust]
generated_with = "0.0.7 (e2ef6425b7f373ac60d637428408baeca689e767)"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1.0", features = ["derive"] } 
tracing = "0.1"

[dev-dependencies]
figment = { version = "0.10", features = ["toml", "env", "test"] }
googletest = "0.14"
